name: CD

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartHome.sln

      - name: Build
        run: dotnet build SmartHome.sln --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish SmartHomeApplication/SmartHomeApplication.csproj --configuration Release --output ./publish/application --no-build

      - name: Publish API
        run: dotnet publish SmartHomeApplicationAPI/SmartHomeApplicationAPI.csproj --configuration Release --output ./publish/api --runtime win-x64 --self-contained false

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarthome-release
          path: ./publish

  deploy:
    name: Deploy to SmartHome Server
    needs: build-and-publish
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: smarthome-release
          path: ./publish

      - name: Stop SmartHome API
        shell: powershell
        run: |
          $svc = Get-Service -Name "SmartHomeApi" -ErrorAction SilentlyContinue
          if ($svc -and $svc.Status -ne 'Stopped') {
            Stop-Service -Name "SmartHomeApi" -Force
            $svc.WaitForStatus('Stopped', [TimeSpan]::FromSeconds(60))
          }
          Start-Sleep -Seconds 3

      - name: Stop SmartHome IIS site
        shell: powershell
        run: |
          Import-Module WebAdministration
          $pool = (Get-Website -Name "SmartHome").applicationPool
          Stop-Website -Name "SmartHome" -ErrorAction SilentlyContinue
          if ((Get-WebAppPoolState -Name $pool).Value -ne 'Stopped') { Stop-WebAppPool -Name $pool }
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-WebAppPoolState -Name $pool).Value -ne 'Stopped' -and (Get-Date) -lt $deadline) {
            Start-Sleep -Seconds 1
          }
          if ((Get-WebAppPoolState -Name $pool).Value -ne 'Stopped') { throw "App pool did not stop" }

      - name: Deploy frontend
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "publish\application"
          $destination = "C:\Users\Administrator\Desktop\ActiveServers\SmartHome\Frontend"

          robocopy $source $destination /MIR /R:3 /W:5

          if ($LASTEXITCODE -ge 8) {
            exit $LASTEXITCODE
          }

          exit 0

      - name: Deploy API
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "publish\api"
          $destination = "C:\Users\Administrator\Desktop\ActiveServers\SmartHome\API"

          robocopy $source $destination /MIR /R:3 /W:5

          if ($LASTEXITCODE -ge 8) {
            exit $LASTEXITCODE
          }

          exit 0

      - name: Start SmartHome API
        shell: powershell
        run: |
          Start-Service -Name "SmartHomeApi"
          $deadline = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 2
            $up = (Test-NetConnection -ComputerName 127.0.0.1 -Port 6200 -WarningAction SilentlyContinue).TcpTestSucceeded
          } until ($up -or (Get-Date) -gt $deadline)
          if (-not $up) {
            Get-Service -Name "SmartHomeApi" | Format-List Name, Status
            Get-WinEvent -FilterHashtable @{LogName='Application'; StartTime=(Get-Date).AddMinutes(-5)} -MaxEvents 20 -ErrorAction SilentlyContinue |
              Where-Object { $_.LevelDisplayName -eq 'Error' } | Format-List TimeCreated, ProviderName, Message
            throw "API is not listening on port 6200"
          }

      - name: Start SmartHome IIS site
        shell: powershell
        run: |
          Import-Module WebAdministration
          $pool = (Get-Website -Name "SmartHome").applicationPool
          Start-WebAppPool -Name $pool
          Start-Website -Name "SmartHome"