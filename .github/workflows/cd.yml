name: CD

on:
  push:
    branches:
      - main

env:
  SITE_NAME: Sk0v.dk
  API_SERVICE: Sk0vApi
  API_PORT: '6200'
  SITE_ROOT: C:\ActiveServers\Sk0v.dk\Sk0v

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartHome.sln

      - name: Build
        run: dotnet build SmartHome.sln --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish SmartHomeApplication/SmartHomeApplication.csproj --configuration Release --output ./publish/application --no-build

      - name: Publish API
        run: dotnet publish SmartHomeApplicationAPI/SmartHomeApplicationAPI.csproj --configuration Release --output ./publish/api --runtime win-x64 --self-contained false

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarthome-release
          path: ./publish

  deploy:
    name: Deploy to SmartHome Server
    needs: build-and-publish
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: smarthome-release
          path: ./publish

      - name: Stop API and IIS site
        shell: powershell
        run: |
          Import-Module WebAdministration

          $svc = Get-Service -Name $env:API_SERVICE -ErrorAction SilentlyContinue
          if ($svc -and $svc.Status -ne 'Stopped') {
            Stop-Service -Name $env:API_SERVICE -Force
            $svc.WaitForStatus('Stopped', [TimeSpan]::FromSeconds(60))
          }

          $pool = (Get-Website -Name $env:SITE_NAME).applicationPool
          Stop-Website -Name $env:SITE_NAME -ErrorAction SilentlyContinue
          if ((Get-WebAppPoolState -Name $pool).Value -ne 'Stopped') { Stop-WebAppPool -Name $pool }
          Start-Sleep -Seconds 3

      - name: Deploy frontend
        shell: powershell
        run: |
          $destination = Join-Path $env:SITE_ROOT 'Frontend'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          robocopy (Join-Path $env:GITHUB_WORKSPACE 'publish\application') $destination /MIR /R:3 /W:5
          if ($LASTEXITCODE -ge 8) { throw "Frontend copy failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Deploy API
        shell: powershell
        run: |
          $destination = Join-Path $env:SITE_ROOT 'API'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          robocopy (Join-Path $env:GITHUB_WORKSPACE 'publish\api') $destination /MIR /R:3 /W:5 /XF secrets.json
          if ($LASTEXITCODE -ge 8) { throw "API copy failed: $LASTEXITCODE" }
          $global:LASTEXITCODE = 0

      - name: Start API
        id: start_api
        shell: powershell
        run: |
          Start-Service -Name $env:API_SERVICE
          $deadline = (Get-Date).AddSeconds(120)
          do {
            Start-Sleep -Seconds 2
            $up = Test-NetConnection -ComputerName 127.0.0.1 -Port ([int]$env:API_PORT) -InformationLevel Quiet -WarningAction SilentlyContinue
            $stopped = (Get-Service -Name $env:API_SERVICE).Status -eq 'Stopped'
          } until ($up -or $stopped -or (Get-Date) -ge $deadline)
          if (-not $up) {
            throw "API is not listening on port $env:API_PORT (service state: $((Get-Service -Name $env:API_SERVICE).Status))"
          }

      - name: Start IIS site
        shell: powershell
        run: |
          Import-Module WebAdministration
          $pool = (Get-Website -Name $env:SITE_NAME).applicationPool
          Start-WebAppPool -Name $pool
          Start-Website -Name $env:SITE_NAME

      # Only runs when the API failed to start. Prints service state, the
      # NSSM stdout/stderr logs and recent Windows events. Lines that look
      # like credentials are hidden.
      - name: API diagnostics
        if: ${{ failure() && steps.start_api.outcome == 'failure' }}
        continue-on-error: true
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          $name = $env:API_SERVICE

          function Hide-Secrets([string[]]$lines) {
            $lines | ForEach-Object {
              if ($_ -match '(?i)password|pwd|secret|token|authorization|postgres(ql)?://|Host=.*;') { '[REDACTED]' } else { $_ }
            }
          }

          $stop = [guid]::NewGuid().ToString('N')
          Write-Output "::stop-commands::$stop"

          Write-Output '=== Service ==='
          Get-CimInstance Win32_Service -Filter "Name='$name'" | Format-List Name, State, StartName, ExitCode, ProcessId

          Write-Output '=== NSSM logs (last 60 lines) ==='
          $params = "HKLM:\SYSTEM\CurrentControlSet\Services\$name\Parameters"
          if (Test-Path $params) {
            $p = Get-ItemProperty $params
            Write-Output "AppDirectory: $($p.AppDirectory)"
            foreach ($f in @($p.AppStdout, $p.AppStderr)) {
              if ($f -and (Test-Path $f)) {
                Write-Output "--- $f"
                Hide-Secrets (Get-Content $f -Tail 60)
              }
              elseif ($f) { Write-Output "--- $f (not found)" }
              else { Write-Output '--- no log file configured in NSSM' }
            }
          }
          else { Write-Output "No NSSM parameters found for $name" }

          Write-Output '=== Application events, last 10 minutes ==='
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-10) } -ErrorAction SilentlyContinue |
            Where-Object { $_.Message -match 'SmartHome|Sk0v|Hangfire|Npgsql' } |
            Sort-Object TimeCreated |
            ForEach-Object {
              "--- $($_.TimeCreated.ToString('s')) $($_.LevelDisplayName)"
              Hide-Secrets ($_.Message -split "`r?`n")
            }

          Write-Output "::$stop::"