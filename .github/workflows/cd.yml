name: CD

on:
  push:
    branches:
      - main

jobs:
  build-and-publish:
    name: Build and Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore SmartHome.sln

      - name: Build
        run: dotnet build SmartHome.sln --configuration Release --no-restore

      - name: Publish application
        run: dotnet publish SmartHomeApplication/SmartHomeApplication.csproj --configuration Release --output ./publish/application --no-build

      - name: Publish API
        run: dotnet publish SmartHomeApplicationAPI/SmartHomeApplicationAPI.csproj --configuration Release --output ./publish/api --no-build

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: smarthome-release
          path: ./publish

  deploy:
    name: Deploy to SmartHome Server
    needs: build-and-publish
    runs-on: [self-hosted, Windows, X64]

    steps:
      - name: Download deployment artifact
        uses: actions/download-artifact@v4
        with:
          name: smarthome-release
          path: ./publish

      - name: Stop SmartHome API
        shell: powershell
        run: |
          Stop-Service -Name "SmartHomeApi" -ErrorAction SilentlyContinue

      - name: Stop SmartHome IIS site
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-Website -Name "SmartHome" -ErrorAction SilentlyContinue

      - name: Deploy frontend
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "publish\application"
          $destination = "C:\Users\Administrator\Desktop\ActiveServers\SmartHome\Frontend"

          robocopy $source $destination /MIR /R:3 /W:5

          if ($LASTEXITCODE -ge 8) {
            exit $LASTEXITCODE
          }

          exit 0

      - name: Deploy API
        shell: powershell
        run: |
          $source = Join-Path $env:GITHUB_WORKSPACE "publish\api"
          $destination = "C:\Users\Administrator\Desktop\ActiveServers\SmartHome\API"

          robocopy $source $destination /MIR /R:3 /W:5

          if ($LASTEXITCODE -ge 8) {
            exit $LASTEXITCODE
          }

          exit 0

      - name: Start SmartHome API
        shell: powershell
        run: |
          Start-Service -Name "SmartHomeApi"

      - name: Start SmartHome IIS site
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-Website -Name "SmartHome"