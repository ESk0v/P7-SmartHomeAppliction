name: Release Branch Check

on:
  pull_request:
    branches:
      - main

jobs:
  check-source-branch:
    name: Require Development Branch
    runs-on: ubuntu-latest

    steps:
      - name: Verify source branch
        run: |
          if [ "${{ github.head_ref }}" != "development" ]; then
            echo "ERROR: Only the development branch can be merged into main."
            echo "Source branch: ${{ github.head_ref }}"
            exit 1
          fi

          echo "Source branch is development."