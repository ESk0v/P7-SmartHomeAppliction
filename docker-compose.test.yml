services:
  postgres-test:
    build:
      context: .
      dockerfile: Dockerfile.postgres-test
    container_name: smarthome-postgres-test
    restart: unless-stopped
    environment:
      POSTGRES_USER: testuser
      POSTGRES_PASSWORD: 
      POSTGRES_DB: SmartHomeTestDB
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql

volumes:
  postgres_test_data:
